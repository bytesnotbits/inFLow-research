name: Deploy Flutter Web

on:
  push:
    branches:
      - main
    paths:
      - 'inflow_web/**'
      - '.github/workflows/deploy-gh-pages.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-gh-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_DIR: inflow_web
  BASE_HREF: /${{ github.event.repository.name }}/

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (for Flutter)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'

      - name: Flutter version
        run: flutter --version

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter web bundle
        run: flutter build web --release --base-href "$BASE_HREF"

      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf ../web-dist
          mkdir -p ../web-dist
          cp -R build/web/. ../web-dist/

      - name: Show build output
        run: |
          echo "Flutter build directory:"
          ls -al build/web
          echo "Artifact directory:"
          ls -al ../web-dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
